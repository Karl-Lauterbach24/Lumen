<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen TV</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="receiver.css">
</head>
<body class="ui">
<video id="video" playsinline></video>

<!-- The interface is laid out for a screen 1080 units high; receiver.js scales it to the real one -->
<div id="stage">
  <div id="glow1" class="glow"></div>
  <div id="glow2" class="glow"></div>
  <div id="grain"></div>
  <div id="head">
    <img id="emblem" src="emblem.png" alt="">
    <span id="brand">LUMEN</span>
    <div id="chips"><span id="netchip" class="chip"></span><span id="clock" class="chip"></span></div>
  </div>
  <div id="view"></div>
  <div id="help"></div>
</div>

<div id="over">
  <div id="tracks"></div>
  <div id="osd">
    <div id="osdShadeTop"></div><div id="osdShadeBottom"></div>
    <div id="osdTitle"></div><div id="osdSub"></div>
    <div id="osdClock"><div id="osdNow"></div><div id="osdEnd"></div></div>
    <div id="osdCenter"><img src="ic-play.svg" alt=""><i></i></div>
    <div id="osdMeta"></div>
    <div id="osdBar"><div id="osdCache"></div><div id="osdBuf"></div><div id="osdFill"></div><div id="osdGhost"></div><div id="osdTicks"></div>
      <div id="osdKnob"></div><div id="osdBubble"><div id="osdBubbleT"></div><div id="osdBubbleC"></div></div></div>
    <div id="osdTimes"><span id="osdTime"></span><span id="osdLeft"></span></div>
    <div id="osdBtns"></div>
    <div id="osdHint"></div>
  </div>
  <div id="toast"></div>
  <div id="saver"><div id="saverBox"><div id="saverClock"></div><div id="saverDate"></div></div></div>
  <div id="intro"><div id="introBox"><img id="introEmblem" src="emblem.png" alt=""><div id="introWord">DISC &middot; CINEMA PLAYER</div></div></div>
</div>

<!-- A packaged TV app puts its platform file next to this page (see Lumen-TV); in a browser it is absent -->
<script src="platform.js" onerror="void 0"></script>
<script src="receiver.js"></script>
</body>
</html>
