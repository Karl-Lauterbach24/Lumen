# Precompiled release for x64 and ARM64: Windows (portable ZIP + MSI installer), macOS (DMG),
# Linux (DEB + RPM), SHA256SUMS.txt, GitHub release.
# Triggered by a tag "v<version>" (e.g. v0.2.0).
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["release/**"]   # Probelauf: bauen + testen, kein Release
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (e.g. v0.2.0)"
        required: true

# a newer push to the same branch replaces the run that is still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  REF: ${{ github.event.inputs.tag || github.ref }}

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, msystem: UCRT64 }
          - { arch: arm64, runner: windows-11-arm, msystem: CLANGARM64 }
    name: windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: git make zip diffutils perl
          # Qt, libass, libplacebo, libbluray ... come from MSYS2; x264, FFmpeg-mvc and mpv are
          # built by tools/build_deps.sh - the same versions as on macOS and Linux.
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p python:p nasm:p meson:p dav1d:p
            qt6-base:p qt6-declarative:p qt6-svg:p qt6-imageformats:p qt6-tools:p
            libbluray:p libdvdnav:p libcdio:p openssl:p libxml2:p
            libass:p libplacebo:p lua51:p lcms2:p libarchive:p libjpeg-turbo:p uchardet:p zimg:p rubberband:p
            vulkan-headers:p vulkan-loader:p shaderc:p spirv-cross:p zlib:p bzip2:p xz:p

      - name: Media libraries (cache)
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: 3rdparty/prefix
          key: deps-windows-${{ matrix.arch }}-${{ hashFiles('tools/build_deps.sh', 'tools/patches/**') }}

      - name: Build media libraries (x264, FFmpeg-mvc, mpv)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          # short source path: deep build trees exceed the 260 character limit
          if ! SRCROOT=/c/lumen-deps tools/build_deps.sh > deps.log 2>&1; then
            # the lines that say what went wrong, then the end of the log
            grep -nE "(error|Error|ERROR|FAILED|fatal|undefined reference|No such file)" deps.log | grep -vE "Werror|-Wno-error|error_resilience|errors?\\.[ch]|strerror" | head -40 > deps.err || true
            cat deps.err
            echo "----"
            tail -40 deps.log
            body=$( (head -25 deps.err; echo "----"; tail -8 deps.log) | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build_deps.sh::$body"
            exit 1
          fi
          grep -E "^===|applied|Done" deps.log
          ls 3rdparty/prefix/bin

      - name: Media libraries -> cache (kept even if a later step fails)
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: 3rdparty/prefix
          key: deps-windows-${{ matrix.arch }}-${{ hashFiles('tools/build_deps.sh', 'tools/patches/**') }}

      - name: Build
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$MINGW_PREFIX \
                -DBLURAY_ROOT=$MINGW_PREFIX -DLUMEN_BUILD_TESTS=ON 2>&1 | tee configure.log
          grep -q "Medienbibliotheken aus" configure.log || { echo "::error::prefix from build_deps.sh not used"; exit 1; }
          if ! cmake --build build --target lumen mvcmerge_test 2>&1 | tee build.log; then
            grep -E "error|undefined reference" build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: "Test: Blu-ray 3D (MVC decoder, both views)"
        run: |
          export PATH="$PWD/3rdparty/prefix/bin:$PATH"
          tools/test_bd3d.sh build build/tests/bd3d

      - name: Package (portable ZIP)
        run: |
          set -e
          VER=$(grep -oE 'project[(]Lumen VERSION [0-9.]+' CMakeLists.txt | awk '{print $3}')
          S=dist/Lumen
          mkdir -p $S
          cp build/lumen.exe build/libdvdcss-2.dll $S/
          windeployqt6 --qmldir qml --no-translations --no-compiler-runtime --dir $S $S/lumen.exe
          # the prefix first: its FFmpeg and libmpv take precedence over anything in MSYS2
          SEARCH="3rdparty/prefix/bin $MINGW_PREFIX/bin"
          python tools/deploy_windows.py $S/lumen.exe --search $SEARCH --own libdvdcss-2.dll
          cp LICENSE THIRD_PARTY.md README.md $S/
          # libdvdcss must be Lumen's stand-in, never the real library
          grep -qa LUMEN_DVDCSS_LIBRARY $S/libdvdcss-2.dll
          (cd dist && zip -qr "../Lumen-$VER-windows-${{ matrix.arch }}.zip" Lumen)
          ls -la Lumen-*.zip

      - name: Start test without MSYS2 (all DLLs in the package)
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $env:LUMEN_SNAPSHOT = "$PWD\snapshot.png"
          $p = Start-Process dist\Lumen\lumen.exe -PassThru
          for ($i = 0; $i -lt 40 -and -not (Test-Path $env:LUMEN_SNAPSHOT); $i++) { Start-Sleep -Milliseconds 500 }
          Stop-Process -Id $p.Id -ErrorAction SilentlyContinue
          if (-not (Test-Path $env:LUMEN_SNAPSHOT)) { Write-Error "Lumen did not start from the package"; exit 1 }
          # self-test: what the packaged libraries can do (Blu-ray 3D, casting, Lua scripts)
          $st = Start-Process dist\Lumen\lumen.exe -ArgumentList "--selftest", "$PWD\selftest.json" -PassThru -Wait
          Get-Content selftest.json
          $j = Get-Content selftest.json -Raw | ConvertFrom-Json
          foreach ($key in "mvc", "cast", "lua", "bluray", "dvdnav") {
            if (-not $j.$key) { Write-Error "self-test: $key is missing"; exit 1 }
          }

      - name: MSI installer (WiX)
        shell: pwsh
        run: |
          if (-not $env:WIX) { choco install wixtoolset --no-progress -y }
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(Lumen VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          ./tools/make_msi.ps1 -Stage dist\Lumen -Version $ver -Arch ${{ matrix.arch }} -Out "Lumen-$ver-windows-${{ matrix.arch }}.msi"
          # second MSI with a higher version, only for the upgrade test
          ./tools/make_msi.ps1 -Stage dist\Lumen -Version 99.0.0 -Arch ${{ matrix.arch }} -Out "$env:RUNNER_TEMP\Lumen-99.0.0.msi"

      - name: "MSI test: install, start, upgrade, uninstall"
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(Lumen VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          ./tools/test_msi.ps1 -Msi "Lumen-$ver-windows-${{ matrix.arch }}.msi" -Upgrade "$env:RUNNER_TEMP\Lumen-99.0.0.msi"

      - uses: actions/upload-artifact@v5
        with:
          name: windows-${{ matrix.arch }}
          path: |
            Lumen-*.zip
            Lumen-*.msi

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x64, runner: macos-15-intel }
    name: macos (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - name: Dependencies
        run: |
          brew install --quiet qt libbluray libdvdnav libdvdread libcdio openssl@3 libxml2 pkgconf ninja meson nasm \
               dav1d libass libplacebo luajit little-cms2 libarchive jpeg-turbo uchardet zimg rubberband xz
      - name: Media libraries (cache)
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: 3rdparty/prefix
          key: deps-macos-${{ matrix.arch }}-${{ hashFiles('tools/build_deps.sh', 'tools/patches/**') }}
      - name: Build media libraries (x264, FFmpeg-mvc, mpv)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          if ! tools/build_deps.sh > deps.log 2>&1; then
            # the lines that say what went wrong, then the end of the log
            grep -nE "(error|Error|ERROR|FAILED|fatal|undefined reference|No such file)" deps.log | grep -vE "Werror|-Wno-error|error_resilience|errors?\\.[ch]|strerror" | head -40 > deps.err || true
            cat deps.err
            echo "----"
            tail -40 deps.log
            body=$( (head -25 deps.err; echo "----"; tail -8 deps.log) | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build_deps.sh::$body"
            exit 1
          fi
          grep -E "^===|applied|Done" deps.log
      - name: Media libraries -> cache (kept even if a later step fails)
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: 3rdparty/prefix
          key: deps-macos-${{ matrix.arch }}-${{ hashFiles('tools/build_deps.sh', 'tools/patches/**') }}
      - name: Build + DMG
        run: |
          set -o pipefail
          VER=$(grep -oE 'project[(]Lumen VERSION [0-9.]+' CMakeLists.txt | awk '{print $3}')
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
                -DLUMEN_BUILD_TESTS=ON 2>&1 | tee configure.log
          grep -q "Medienbibliotheken aus" configure.log || { echo "::error::prefix from build_deps.sh not used"; exit 1; }
          if ! cmake --build build --target lumen mvcmerge_test 2>&1 | tee build.log; then
            grep -E "error|Undefined symbols" build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          PATH="$PWD/3rdparty/prefix/bin:$PATH" tools/test_bd3d.sh build build/tests/bd3d
          cmake --build build --target lumen_dmg
          mv build/Lumen.dmg "Lumen-$VER-macos-${{ matrix.arch }}.dmg"
          ls -la Lumen-*.dmg
          file build/Lumen.app/Contents/MacOS/Lumen
      - name: Bundle check (no Homebrew paths, the app starts)
        run: |
          if find build/Lumen.app/Contents -type f -print0 | xargs -0 file | grep Mach-O | cut -d: -f1 \
               | while read -r f; do otool -L "$f" | tail -n +2; done | grep -E "/opt/homebrew|/usr/local/(opt|Cellar|lib)|3rdparty/prefix"; then
            echo "::error::Lumen.app still refers to libraries outside the bundle"; exit 1
          fi
          # without the build prefix: the bundle has to bring everything itself
          mv 3rdparty/prefix 3rdparty/prefix.off
          build/Lumen.app/Contents/MacOS/Lumen --selftest /tmp/selftest.json
          cat /tmp/selftest.json
          for key in mvc cast lua bluray dvdnav; do
            grep -q "\"$key\": true" /tmp/selftest.json || { echo "::error::self-test: $key is missing"; exit 1; }
          done
          rm -f /tmp/lumen-bundle.png
          LUMEN_SNAPSHOT=/tmp/lumen-bundle.png build/Lumen.app/Contents/MacOS/Lumen &
          PID=$!
          for i in $(seq 1 60); do [ -s /tmp/lumen-bundle.png ] && break; sleep 1; done
          kill $PID 2>/dev/null || true
          [ -s /tmp/lumen-bundle.png ] || { echo "::error::Lumen.app from the bundle does not start"; exit 1; }
      - uses: actions/upload-artifact@v5
        with:
          name: macos-${{ matrix.arch }}
          path: Lumen-*.dmg

  linux:
    uses: ./.github/workflows/linux.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  release:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
      - name: Checksums + GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          sha256sum Lumen-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          VER=$(grep -oE 'project[(]Lumen VERSION [0-9.]+' ../CMakeLists.txt | awk '{print $3}')
          TAG="v$VER"
          NOTES="../docs/release-notes/$VER.md"
          [ -f "$NOTES" ] || { echo "Lumen $VER" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          # Release notes that start with "<!-- draft -->" create a draft: all assets are attached,
          # but the release only becomes public (and visible to the updater) when it is published
          # on the Releases page.
          DRAFT=""
          if head -1 "$NOTES" | grep -q '<!-- draft -->'; then
            DRAFT="--draft"
            tail -n +2 "$NOTES" > /tmp/notes-body.md; NOTES=/tmp/notes-body.md
          fi
          gh release create "$TAG" Lumen-* SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "Lumen $VER" --notes-file "$NOTES" $DRAFT
