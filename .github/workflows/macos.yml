# macOS: Build (Homebrew), Tests, eigenständiges Lumen.app + DMG
name: macOS

on:
  push:
    branches: [main, "feature/**", "release/**"]
  pull_request:
  workflow_dispatch:

# a newer push to the same branch replaces the run that is still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5

      # Qt, libass, libplacebo, libbluray ... kommen von Homebrew; x264, FFmpeg-mvc und mpv baut
      # tools/build_deps.sh – dieselben Versionen wie unter Windows und Linux.
      - name: Abhängigkeiten (Homebrew)
        run: |
          brew update --quiet
          brew install --quiet qt libbluray libdvdnav libdvdread libcdio openssl@3 libxml2 pkgconf ninja meson nasm \
               dav1d libass libplacebo luajit little-cms2 libarchive jpeg-turbo uchardet zimg rubberband xz dvdauthor vcdimager || true
          # dvdauthor/vcdimager erzeugen nur Testmaterial – alles andere muss da sein
          for f in qt libbluray libdvdnav libcdio openssl@3 libxml2 ninja meson nasm dav1d libass libplacebo luajit little-cms2 libarchive; do
            brew list --versions "$f" >/dev/null || { echo "::error::$f fehlt"; exit 1; }
          done

      - name: Medienbibliotheken (Cache)
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: 3rdparty/prefix
          key: deps-macos-arm64-${{ hashFiles('tools/build_deps.sh', 'tools/patches/**') }}

      - name: Medienbibliotheken bauen (x264, FFmpeg-mvc, mpv)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          if ! tools/build_deps.sh > deps.log 2>&1; then
            # the lines that say what went wrong, then the end of the log
            grep -nE "(error|Error|ERROR|FAILED|fatal|undefined reference|No such file)" deps.log | grep -vE "Werror|-Wno-error|error_resilience|errors?\\.[ch]|strerror" | head -40 > deps.err || true
            cat deps.err
            echo "----"
            tail -40 deps.log
            body=$( (head -25 deps.err; echo "----"; tail -8 deps.log) | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build_deps.sh::$body"
            exit 1
          fi
          grep -E "^===|applied|Done" deps.log

      - name: Media libraries -> cache (kept even if a later step fails)
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: 3rdparty/prefix
          key: deps-macos-arm64-${{ hashFiles('tools/build_deps.sh', 'tools/patches/**') }}

      - name: Konfigurieren
        run: |
          echo "$PWD/3rdparty/prefix/bin" >> "$GITHUB_PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUMEN_BUILD_TESTS=ON \
                -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" 2>&1 | tee configure.log
          grep -q "Medienbibliotheken aus" configure.log || { echo "::error::Präfix aus build_deps.sh nicht benutzt"; exit 1; }
          grep -q "OpenSSL (DCP-Entschlüsselung): TRUE" configure.log || echo "::warning::OpenSSL nicht gefunden"
          grep -qE "libdvdnav: (1|TRUE)" configure.log || echo "::warning::libdvdnav nicht gefunden"
          grep -qE "libxml2 \(KDM-Signatur\): (1|TRUE)" configure.log || echo "::warning::libxml2 nicht gefunden"

      - name: Bauen
        run: |
          set -o pipefail
          if ! cmake --build build 2>&1 | tee build.log; then
            # Compilerfehler als Annotationen (auch ohne Anmeldung über die API lesbar)
            grep -E "^[^ ]+:[0-9]+:[0-9]+: (fatal )?error:" build.log | head -40 | while IFS= read -r l; do
              f=${l%%:*}; rest=${l#*:}; line=${rest%%:*}
              echo "::error file=${f#$GITHUB_WORKSPACE/},line=$line::${l#*error: }"
            done
            grep -E "error|Error" build.log | grep -vE "^[^ ]+:[0-9]+:[0-9]+:" | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: "Test: DCP (JPEG 2000, KDM, Entschlüsselung, Signatur, Untertitel, 3D)"
        run: |
          mkdir -p build/logs; exec > >(tee -a build/logs/dcp.txt) 2>&1
          set -e
          T=build/tests; mkdir -p $T; B=build
          $B/dcp_test gencert $T/id
          python3 tools/make_test_dcp.py ffmpeg "$(brew --prefix openssl@3)/bin/openssl" $T/dcp --encrypt $T/id/leaf.pem
          $B/dcp_test info $T/dcp
          $B/dcp_test kdm $T/dcp/kdm.xml $T/id/leaf.key
          $B/dcp_test subs $T/dcp
          $B/dcp_test play $T/dcp $T/dcp/kdm.xml $T/id/leaf.key 1.5 | tee $T/play.txt
          # KDM-Signatur: signiert -> gültig, verändert -> abgelehnt
          $B/dcp_test gencert $T/signer
          $B/dcp_test signkdm $T/dcp/kdm.xml $T/signer/leaf.key $T/signer/chain.pem $T/kdm_signed.xml
          $B/dcp_test verifykdm $T/kdm_signed.xml
          sed 's/<ContentTitleText>/<ContentTitleText>X/' $T/kdm_signed.xml > $T/kdm_tampered.xml
          if $B/dcp_test verifykdm $T/kdm_tampered.xml; then echo "::error::veränderte KDM wurde akzeptiert"; exit 1; fi
          python3 tools/make_test_dcp.py ffmpeg "$(brew --prefix openssl@3)/bin/openssl" $T/dcp3d --encrypt $T/id/leaf.pem --stereo
          $B/dcp_test play3d $T/dcp3d $T/dcp3d/kdm.xml $T/id/leaf.key $T/sbs.png

      - name: "Test: Atmos/IAB (DTS-Renderer, verschlüsselt, alle Layouts)"
        run: |
          mkdir -p build/logs; exec > >(tee -a build/logs/iab.txt) 2>&1
          set -e
          T=build/tests
          build/iab_testgen $T/iab.bin 48
          python3 tools/make_test_dcp.py ffmpeg "$(brew --prefix openssl@3)/bin/openssl" $T/atmos --encrypt $T/id/leaf.pem --iab $T/iab.bin
          K=$(sed -n 3p $T/atmos/keys.txt | cut -d' ' -f2)
          for L in 7.1.4 5.1.4 7.1 5.1 2.0; do build/dcp_test iab $T/atmos/atmos.mxf $K $L --check; done
          build/dcp_test play $T/atmos $T/atmos/kdm.xml $T/id/leaf.key 1.5 --iab | tee $T/iabplay.txt
          grep -q "audio-ch=12" $T/iabplay.txt

      - name: "Test: Plugins (nativ, Skript, URL-Schema, DCP-Schlüssel)"
        run: |
          mkdir -p build/logs; exec > >(tee -a build/logs/plugins.txt) 2>&1
          set -e
          build/plugin_test build/plugins build/tests/dcp | tee build/tests/plugins.txt
          grep -q BESTANDEN build/tests/plugins.txt

      - name: "Test: Medienserver (Jellyfin/Emby/Plex), Bildschirmzuordnung"
        run: |
          mkdir -p build/logs; exec > >(tee -a build/logs/media.txt) 2>&1
          set -e
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x360:rate=24 -f lavfi -i sine=f=440 -t 2                  -c:v libx264 -c:a aac -pix_fmt yuv420p build/tests/stream.mp4
          build/media_test python3 tools/mock_media_server.py build/tests/stream.mp4
          build/display_test

      - name: "Test: Disc-Erkennung (Audio-CD-Abbild, CD-Text, Plugin disc-identify aus dem Store)"
        run: |
          mkdir -p build/logs; exec > >(tee -a build/logs/discinfo.txt) 2>&1
          set -e
          git clone -q --depth 1 https://github.com/Karl-Lauterbach24/Lumen-Plugins build/Lumen-Plugins
          [ -d build/Lumen-Plugins/plugins/disc-identify ] || { echo "::warning::Plugin disc-identify fehlt im Store – Test übersprungen"; exit 0; }
          build/discinfo_test build/Lumen-Plugins/plugins python3 tools/mock_disc_server.py

      - name: "Test: Blu-ray 3D (MVC-Decoder, beide Ansichten)"
        run: |
          mkdir -p build/logs; exec > >(tee -a build/logs/bd3d.txt) 2>&1
          tools/test_bd3d.sh build build/tests/bd3d
          tools/test_seq3d.sh build build/tests/seq3d

      - name: "Test: Übertragung (Sendestrom, Ton-Bild-Abgleich, DLNA, Chromecast, AirPlay, TV-App)"
        run: |
          mkdir -p build/logs; exec > >(tee -a build/logs/cast.txt) 2>&1
          set -e
          ffmpeg -hide_banner -loglevel error -y \
                 -f lavfi -i "color=c=black:s=640x360:r=30,drawbox=x=0:y=0:w=80:h=45:c=white:t=fill,drawbox=c=white:t=fill:enable='lt(mod(t\,1)\,0.1)'" \
                 -f lavfi -i "aevalsrc='0.5*sin(2*PI*1000*t)*lt(mod(t\,1)\,0.1)':s=48000:c=stereo" \
                 -t 20 -c:v libx264 -g 30 -pix_fmt yuv420p -c:a aac build/tests/sync.mp4
          rc=0
          build/cast_test python3 tools/mock_cast_devices.py "$(brew --prefix openssl@3)/bin/openssl" build/tests/sync.mp4 > build/tests/cast.txt 2>&1 || rc=$?
          cat build/tests/cast.txt
          grep -q BESTANDEN build/tests/cast.txt && [ "$rc" -eq 0 ]

      - name: "Test: Video-CD-Menüs (PBC, mit vcdxbuild erstellt)"
        run: |
          mkdir -p build/logs; exec > >(tee -a build/logs/vcd.txt) 2>&1
          if ! command -v vcdxbuild >/dev/null; then echo "::warning::vcdimager fehlt – VCD-Test übersprungen"; exit 0; fi
          set -e
          python3 tools/make_test_vcd_pbc.py ffmpeg vcdxbuild build/tests/vcd
          rc=0; build/vcd_test build/tests/vcd/pbc.cue > build/tests/vcd.txt 2>&1 || rc=$?
          cat build/tests/vcd.txt; echo "vcd_test exit=$rc"
          grep -q BESTANDEN build/tests/vcd.txt && [ "$rc" -eq 0 ]

      - name: "Test: DVD-Menüs (Render-API)"
        run: |
          mkdir -p build/logs; exec > >(tee -a build/logs/dvd.txt) 2>&1
          if ! command -v dvdauthor >/dev/null; then echo "::warning::dvdauthor fehlt – DVD-Test übersprungen"; exit 0; fi
          set -e
          T=build/tests
          python3 tools/make_test_dvd.py ffmpeg dvdauthor spumux $T/dvd
          build/dvd_test $T/dvd/DVD $T/dvdshots | tee $T/dvd.txt
          grep -q BESTANDEN $T/dvd.txt

      - name: "Test: Player-Fenster rendert (lumen.app)"
        run: |
          mkdir -p build/logs; exec > >(tee -a build/logs/player.txt) 2>&1
          set -e
          APP=build/Lumen.app/Contents/MacOS/Lumen
          export LUMEN_PLAYER_SNAPSHOT="$PWD/build/tests/player.png@1.0"
          "$APP" "av://lavfi:testsrc2=size=1280x720:rate=24" > build/tests/lumen.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do [ -s build/tests/player.png ] && break; sleep 1; done
          kill $PID 2>/dev/null || true
          tail -30 build/tests/lumen.log
          [ -s build/tests/player.png ] || { echo "::error::Player-Fenster hat kein Bild geliefert"; exit 1; }
          python3 - <<'EOF'
          import struct, zlib
          d = open("build/tests/player.png", "rb").read()
          w, h = struct.unpack(">II", d[16:24])
          print("player.png", w, "x", h)
          assert w >= 640 and h >= 360, "Fenster zu klein"
          EOF

      - name: Lumen.app + DMG (macdeployqt)
        run: |
          mkdir -p build/logs; exec > >(tee -a build/logs/dmg.txt) 2>&1
          cmake --build build --target lumen_dmg
          ls -la build/*.dmg
          # libdvdcss im Bundle muss Lumens Shim sein (kein Kopierschutz-Code im Paket)
          F=build/Lumen.app/Contents/Frameworks/libdvdcss.2.dylib
          if [ -f "$F" ]; then
            strings "$F" | grep -q LUMEN_DVDCSS_LIBRARY || { echo "::error::Bundle enthält die echte libdvdcss"; exit 1; }
            echo "libdvdcss.2.dylib = Lumen-Shim"
          fi
          # das Bundle muss ohne Homebrew-Pfade auskommen
          if find build/Lumen.app/Contents -type f -print0 | xargs -0 file | grep Mach-O | cut -d: -f1                | while read -r f; do otool -L "$f" | tail -n +2; done | grep -E "/opt/homebrew|/usr/local/(opt|Cellar)|3rdparty/prefix"; then
            echo "::error::Lumen.app verweist noch auf Homebrew-Bibliotheken"; exit 1
          fi
          # ohne das Build-Präfix: das Bundle muss alles selbst mitbringen
          mv 3rdparty/prefix 3rdparty/prefix.off
          trap 'mv 3rdparty/prefix.off 3rdparty/prefix' EXIT
          build/Lumen.app/Contents/MacOS/Lumen --selftest /tmp/selftest.json
          cat /tmp/selftest.json
          for key in mvc cast lua bluray dvdnav; do
            grep -q "\"$key\": true" /tmp/selftest.json || { echo "::error::Selbsttest: $key fehlt"; exit 1; }
          done
          # das ausgelieferte Bundle muss starten (Steuerfenster als Bild speichern)
          rm -f /tmp/lumen-bundle.png
          LUMEN_SNAPSHOT=/tmp/lumen-bundle.png build/Lumen.app/Contents/MacOS/Lumen &
          PID=$!
          for i in $(seq 1 60); do [ -s /tmp/lumen-bundle.png ] && break; sleep 1; done
          kill $PID 2>/dev/null || true
          [ -s /tmp/lumen-bundle.png ] || { echo "::error::Lumen.app aus dem Bundle startet nicht"; exit 1; }
          echo "Bundle startet: Steuerfenster gerendert"

      - name: Fehlerprotokolle als Annotationen
        if: failure()
        run: |
          # Protokollende je Etappe als eine Annotation (ohne Anmeldung per API lesbar)
          for f in build/logs/*.txt; do
            [ -f "$f" ] || continue
            body=$(tail -40 "$f" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$(basename "$f")::$body"
          done

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Lumen-macOS
          path: |
            build/*.dmg
            build/tests/*.png
            build/tests/dvdshots
            build/tests/*.txt
            build/tests/*.log
          if-no-files-found: ignore
