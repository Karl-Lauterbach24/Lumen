# Linux: Build, Tests und Pakete (DEB auf Debian 13, RPM auf Fedora 44), jeweils x86-64 und ARM64.
# Wird auch vom Release-Workflow aufgerufen (workflow_call) – die Pakete liegen
# dann als Artefakte "linux-<paket>-<architektur>" im selben Lauf.
name: Linux

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: deb, arch: amd64, image: "debian:trixie", generator: DEB, runner: ubuntu-latest }
          - { name: rpm, arch: x86_64, image: "fedora:44", generator: RPM, runner: ubuntu-latest }
          - { name: deb, arch: arm64, image: "debian:trixie", generator: DEB, runner: ubuntu-24.04-arm }
          - { name: rpm, arch: aarch64, image: "fedora:44", generator: RPM, runner: ubuntu-24.04-arm }
    name: ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Abhängigkeiten
        run: |
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q
            apt-get install -y -q --no-install-recommends ca-certificates git cmake ninja-build g++ pkg-config file dpkg-dev python3 \
              qt6-base-dev qt6-declarative-dev libmpv-dev libbluray-dev libdvdnav-dev libdvdread-dev libcdio-dev libiso9660-dev \
              libssl-dev libxml2-dev openssl ffmpeg xvfb xauth libgl1-mesa-dri procps
          else
            dnf install -y -q git cmake ninja-build gcc-c++ pkgconf-pkg-config file rpm-build python3 \
              qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg mpv-devel libbluray-devel libdvdnav-devel libdvdread-devel \
              libcdio-devel openssl-devel libxml2-devel openssl ffmpeg-free xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers procps-ng
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Konfigurieren
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DLUMEN_BUILD_TESTS=ON 2>&1 | tee configure.log
          grep "Lumen:" configure.log
          grep -q "OpenSSL (DCP-Entschlüsselung): TRUE" configure.log || { echo "::error::OpenSSL nicht gefunden"; exit 1; }
          grep -qE "libdvdnav: (1|TRUE)" configure.log || { echo "::error::libdvdnav nicht gefunden"; exit 1; }
          grep -qE "libcdio: (1|TRUE)" configure.log || { echo "::error::libcdio nicht gefunden"; exit 1; }

      - name: Bauen
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build build 2>&1 | tee build.log; then
            grep -E "^[^ ]+:[0-9]+:[0-9]+: (fatal )?error:" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            grep -E "error|Error|undefined reference" build.log | grep -vE "^[^ ]+:[0-9]+:[0-9]+:" | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: "Test: DCP (JPEG 2000, KDM, Entschlüsselung, Untertitel)"
        shell: bash
        run: |
          set -e
          T=build/tests; mkdir -p $T; B=build
          $B/dcp_test gencert $T/id
          python3 tools/make_test_dcp.py ffmpeg openssl $T/dcp --encrypt $T/id/leaf.pem
          $B/dcp_test info $T/dcp
          $B/dcp_test kdm $T/dcp/kdm.xml $T/id/leaf.key
          $B/dcp_test subs $T/dcp
          $B/dcp_test play $T/dcp $T/dcp/kdm.xml $T/id/leaf.key 1.5

      - name: "Test: Plugins, Medienserver, Bildschirmzuordnung"
        shell: bash
        run: |
          set -e
          build/plugin_test build/plugins build/tests/dcp | tee build/tests/plugins.txt
          grep -q BESTANDEN build/tests/plugins.txt
          # ffmpeg-free (Fedora) hat kein H.264/AAC: VP9/Opus, mpv erkennt den Container am Inhalt
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x360:rate=24 -f lavfi -i sine=f=440 -t 2 \
                 -c:v libvpx-vp9 -c:a libopus -f matroska build/tests/stream.mp4
          build/media_test python3 tools/mock_media_server.py build/tests/stream.mp4
          build/display_test

      - name: "Test: Disc-Erkennung (Audio-CD-Abbild, CD-Text, Plugin disc-identify aus dem Store)"
        shell: bash
        run: |
          set -e
          git clone -q --depth 1 https://github.com/Karl-Lauterbach24/Lumen-Plugins build/Lumen-Plugins
          [ -d build/Lumen-Plugins/plugins/disc-identify ] || { echo "::warning::Plugin disc-identify fehlt im Store – Test übersprungen"; exit 0; }
          build/discinfo_test build/Lumen-Plugins/plugins python3 tools/mock_disc_server.py

      - name: Paket bauen (${{ matrix.generator }})
        shell: bash
        run: |
          set -e
          cd build
          cpack -G ${{ matrix.generator }}
          ls -la Lumen-*
          if [ "${{ matrix.generator }}" = DEB ]; then dpkg-deb -I Lumen-*.deb; dpkg-deb -c Lumen-*.deb; else rpm -qpiR Lumen-*.rpm; rpm -qpl Lumen-*.rpm; fi

      - name: Paket installieren und starten
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.generator }}" = DEB ]; then
            apt-get install -y -q ./build/Lumen-*.deb
          else
            dnf install -y -q ./build/Lumen-*.rpm
          fi
          command -v lumen
          # Steuerfenster des installierten Programms rendern (virtueller X-Server, Software-Rendering)
          export QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software LUMEN_SNAPSHOT=/tmp/lumen.png
          # der virtuelle X-Server startet im Container nicht immer zuverlässig: bis zu 3 Versuche
          for try in 1 2 3; do
            xvfb-run -a -s "-screen 0 1600x900x24" lumen > /tmp/lumen.log 2>&1 &
            for i in $(seq 1 40); do [ -s /tmp/lumen.png ] && break; sleep 1; done
            pkill -x lumen || true; pkill Xvfb || true; sleep 2
            echo "--- Versuch $try"; tail -15 /tmp/lumen.log
            [ -s /tmp/lumen.png ] && break
          done
          [ -s /tmp/lumen.png ] || { echo "::error::installiertes Lumen startet nicht"; exit 1; }
          echo "installiertes Lumen startet: Steuerfenster gerendert"

      - name: Player-Fenster (informativ, Software-GL unter Xvfb)
        shell: bash
        continue-on-error: true
        run: |
          export QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software LUMEN_PLAYER_SNAPSHOT="/tmp/player.png@1.0" LUMEN_MPV_LOG=v
          xvfb-run -a -s "-screen 0 1600x900x24" lumen "av://lavfi:testsrc2=size=1280x720:rate=24" > /tmp/player.log 2>&1 &
          for i in $(seq 1 40); do [ -s /tmp/player.png ] && break; sleep 1; done
          pkill -x lumen || true
          grep -iE "vo/|vo:|gpu|opengl|egl|x11|error|fail|Playing|AO:|VO:" /tmp/player.log | head -60
          # Ohne GPU lehnt mpv den Software-Renderer ab ("Suspected software renderer") – dann sagt dieser Schritt nichts aus
          if [ -s /tmp/player.png ]; then echo "::notice::Player-Fenster rendert unter Xvfb (${{ matrix.name }})"; else echo "Player-Fenster: kein Bild ohne GPU (${{ matrix.name }})"; fi

      - uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.name }}-${{ matrix.arch }}
          path: |
            build/Lumen-*.deb
            build/Lumen-*.rpm
          if-no-files-found: error
