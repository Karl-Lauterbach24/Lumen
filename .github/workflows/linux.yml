# Linux: Build, Tests und Pakete (DEB auf Debian 13, RPM auf Fedora 44), jeweils x86-64 und ARM64.
# Wird auch vom Release-Workflow aufgerufen (workflow_call) – die Pakete liegen
# dann als Artefakte "linux-<paket>-<architektur>" im selben Lauf.
name: Linux

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: deb, arch: amd64, image: "debian:trixie", generator: DEB, runner: ubuntu-latest }
          - { name: rpm, arch: x86_64, image: "fedora:44", generator: RPM, runner: ubuntu-latest }
          - { name: deb, arch: arm64, image: "debian:trixie", generator: DEB, runner: ubuntu-24.04-arm }
          - { name: rpm, arch: aarch64, image: "fedora:44", generator: RPM, runner: ubuntu-24.04-arm }
    name: ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 100
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # Qt, libass, libplacebo, libbluray ... kommen von der Distribution; x264, FFmpeg-mvc, mpv
      # (und unter Debian libdvdnav 7) baut tools/build_deps.sh – überall dieselben Versionen.
      - name: Abhängigkeiten
        run: |
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q
            apt-get install -y -q --no-install-recommends ca-certificates git cmake ninja-build g++ make pkg-config file dpkg-dev python3 \
              patchelf meson nasm zstd perl \
              qt6-base-dev qt6-declarative-dev libbluray-dev libcdio-dev libiso9660-dev libssl-dev libxml2-dev openssl \
              libdav1d-dev zlib1g-dev libbz2-dev liblzma-dev libva-dev libvdpau-dev \
              libass-dev libplacebo-dev libluajit-5.1-dev libarchive-dev liblcms2-dev libjpeg-dev libuchardet-dev libzimg-dev librubberband-dev \
              libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxrandr-dev libxpresent-dev libxss-dev libxinerama-dev libxfixes-dev \
              libwayland-dev wayland-protocols libxkbcommon-dev libegl-dev libgl-dev libvulkan-dev libdrm-dev libgbm-dev \
              xvfb xauth libgl1-mesa-dri procps
          else
            dnf install -y -q git cmake ninja-build gcc-c++ gcc make pkgconf-pkg-config file rpm-build python3 \
              patchelf meson nasm zstd perl-interpreter \
              qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg libbluray-devel libdvdnav-devel libdvdread-devel libcdio-devel \
              openssl-devel libxml2-devel openssl \
              libdav1d-devel zlib-devel bzip2-devel xz-devel libva-devel libvdpau-devel \
              libass-devel libplacebo-devel luajit-devel libarchive-devel lcms2-devel libjpeg-turbo-devel uchardet-devel zimg-devel rubberband-devel \
              alsa-lib-devel pulseaudio-libs-devel pipewire-devel libX11-devel libXext-devel libXrandr-devel libXpresent-devel libXScrnSaver-devel \
              libXinerama-devel libXfixes-devel wayland-devel wayland-protocols-devel libxkbcommon-devel mesa-libEGL-devel mesa-libGL-devel vulkan-loader-devel \
              libdrm-devel mesa-libgbm-devel \
              xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers procps-ng
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Medienbibliotheken (Cache)
        id: deps
        uses: actions/cache@v4
        with:
          path: 3rdparty/prefix
          key: deps-linux-${{ matrix.name }}-${{ matrix.arch }}-${{ hashFiles('tools/build_deps.sh', 'tools/patches/**') }}

      - name: Medienbibliotheken bauen (x264, FFmpeg-mvc, mpv, ggf. libdvdnav 7)
        if: steps.deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          # the container runs as root on a checkout owned by another user: git refuses to work there otherwise
          git config --global --add safe.directory '*'
          if ! tools/build_deps.sh > deps.log 2>&1; then
            # the lines that say what went wrong, then the end of the log
            grep -nE "(error|Error|ERROR|FAILED|fatal|undefined reference|No such file)" deps.log | grep -vE "Werror|-Wno-error|error_resilience|errors?\\.[ch]|strerror" | head -40 > deps.err || true
            cat deps.err
            echo "----"
            tail -40 deps.log
            body=$( (head -25 deps.err; echo "----"; tail -8 deps.log) | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build_deps.sh::$body"
            exit 1
          fi
          grep -E "^===|applied|Done" deps.log

      - name: Konfigurieren
        shell: bash
        run: |
          echo "$PWD/3rdparty/prefix/bin" >> "$GITHUB_PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DLUMEN_BUILD_TESTS=ON 2>&1 | tee configure.log
          grep "Lumen:" configure.log
          grep -q "Medienbibliotheken aus" configure.log || { echo "::error::Präfix aus build_deps.sh nicht benutzt"; exit 1; }
          grep -q "OpenSSL (DCP-Entschlüsselung): TRUE" configure.log || { echo "::error::OpenSSL nicht gefunden"; exit 1; }
          grep -qE "libdvdnav: (1|TRUE) \(7" configure.log || { echo "::error::libdvdnav 7 nicht gefunden"; exit 1; }
          grep -qE "libcdio: (1|TRUE)" configure.log || { echo "::error::libcdio nicht gefunden"; exit 1; }

      - name: Bauen
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build build 2>&1 | tee build.log; then
            grep -E "^[^ ]+:[0-9]+:[0-9]+: (fatal )?error:" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            grep -E "error|Error|undefined reference" build.log | grep -vE "^[^ ]+:[0-9]+:[0-9]+:" | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: "Test: DCP (JPEG 2000, KDM, Entschlüsselung, Untertitel)"
        shell: bash
        run: |
          set -e
          T=build/tests; mkdir -p $T; B=build
          $B/dcp_test gencert $T/id
          python3 tools/make_test_dcp.py ffmpeg openssl $T/dcp --encrypt $T/id/leaf.pem
          $B/dcp_test info $T/dcp
          $B/dcp_test kdm $T/dcp/kdm.xml $T/id/leaf.key
          $B/dcp_test subs $T/dcp
          $B/dcp_test play $T/dcp $T/dcp/kdm.xml $T/id/leaf.key 1.5

      - name: "Test: Plugins, Medienserver, Bildschirmzuordnung"
        shell: bash
        run: |
          set -e
          build/plugin_test build/plugins build/tests/dcp | tee build/tests/plugins.txt
          grep -q BESTANDEN build/tests/plugins.txt
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x360:rate=24 -f lavfi -i sine=f=440 -t 2 \
                 -c:v libx264 -c:a aac -pix_fmt yuv420p build/tests/stream.mp4
          build/media_test python3 tools/mock_media_server.py build/tests/stream.mp4
          build/display_test

      - name: "Test: Disc-Erkennung (Audio-CD-Abbild, CD-Text, Plugin disc-identify aus dem Store)"
        shell: bash
        run: |
          set -e
          git clone -q --depth 1 https://github.com/Karl-Lauterbach24/Lumen-Plugins build/Lumen-Plugins
          [ -d build/Lumen-Plugins/plugins/disc-identify ] || { echo "::warning::Plugin disc-identify fehlt im Store – Test übersprungen"; exit 0; }
          build/discinfo_test build/Lumen-Plugins/plugins python3 tools/mock_disc_server.py

      - name: "Test: Blu-ray 3D (MVC-Decoder, beide Ansichten)"
        shell: bash
        run: tools/test_bd3d.sh build build/tests/bd3d

      - name: "Test: Übertragung (Sendestrom, Ton-Bild-Abgleich, DLNA, Chromecast, AirPlay, TV-App)"
        shell: bash
        run: |
          set -e
          ffmpeg -hide_banner -loglevel error -y \
                 -f lavfi -i "color=c=black:s=640x360:r=30,drawbox=x=0:y=0:w=80:h=45:c=white:t=fill,drawbox=c=white:t=fill:enable='lt(mod(t\,1)\,0.1)'" \
                 -f lavfi -i "aevalsrc='0.5*sin(2*PI*1000*t)*lt(mod(t\,1)\,0.1)':s=48000:c=stereo" \
                 -t 20 -c:v libx264 -g 30 -pix_fmt yuv420p -c:a aac build/tests/sync.mp4
          # OpenGL ohne Grafikkarte: virtueller X-Server mit Mesa (llvmpipe)
          export QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1
          rc=0
          xvfb-run -a -s "-screen 0 1280x720x24" build/cast_test python3 tools/mock_cast_devices.py openssl build/tests/sync.mp4 > build/tests/cast.txt 2>&1 || rc=$?
          cat build/tests/cast.txt
          grep -E "^FAIL" build/tests/cast.txt | while IFS= read -r l; do echo "::error::$l"; done
          grep -q BESTANDEN build/tests/cast.txt && [ "$rc" -eq 0 ]

      - name: Paket bauen (${{ matrix.generator }})
        shell: bash
        run: |
          set -e
          cd build
          cpack -G ${{ matrix.generator }}
          ls -la Lumen-*
          if [ "${{ matrix.generator }}" = DEB ]; then dpkg-deb -I Lumen-*.deb; dpkg-deb -c Lumen-*.deb; else rpm -qpiR Lumen-*.rpm; rpm -qpl Lumen-*.rpm; fi

      - name: Paket installieren und starten
        shell: bash
        run: |
          set -e
          # das installierte Programm darf nichts aus dem Build-Baum laden
          mv 3rdparty/prefix 3rdparty/prefix.off
          trap 'mv 3rdparty/prefix.off 3rdparty/prefix' EXIT
          if [ "${{ matrix.generator }}" = DEB ]; then
            apt-get install -y -q ./build/Lumen-*.deb
          else
            dnf install -y -q ./build/Lumen-*.rpm
          fi
          command -v lumen
          ldd "$(command -v lumen)" | grep -E "libmpv|libavcodec|libx264|libdvdnav" || true
          if ldd "$(command -v lumen)" | grep -E "libmpv|libavcodec" | grep -v "/usr/lib/lumen/"; then
            echo "::error::lumen lädt Medienbibliotheken nicht aus /usr/lib/lumen"; exit 1
          fi
          if ldd "$(command -v lumen)" | grep -q "not found"; then
            ldd "$(command -v lumen)" | grep "not found" | while IFS= read -r l; do echo "::error::$l"; done; exit 1
          fi
          # Selbsttest: mitgelieferte Bibliotheken (Blu-ray 3D, Übertragung, Lua-Skripte)
          lumen --selftest /tmp/selftest.json
          cat /tmp/selftest.json
          for key in mvc cast lua bluray dvdnav; do
            grep -q "\"$key\": true" /tmp/selftest.json || { echo "::error::Selbsttest: $key fehlt"; exit 1; }
          done
          # Steuerfenster des installierten Programms rendern (virtueller X-Server, Software-Rendering)
          export QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software LUMEN_SNAPSHOT=/tmp/lumen.png
          # der virtuelle X-Server startet im Container nicht immer zuverlässig: bis zu 3 Versuche
          for try in 1 2 3; do
            xvfb-run -a -s "-screen 0 1600x900x24" lumen > /tmp/lumen.log 2>&1 &
            for i in $(seq 1 40); do [ -s /tmp/lumen.png ] && break; sleep 1; done
            pkill -x lumen || true; pkill Xvfb || true; sleep 2
            echo "--- Versuch $try"; tail -15 /tmp/lumen.log
            [ -s /tmp/lumen.png ] && break
          done
          [ -s /tmp/lumen.png ] || { echo "::error::installiertes Lumen startet nicht"; exit 1; }
          echo "installiertes Lumen startet: Steuerfenster gerendert"

      - name: Player-Fenster (informativ, Software-GL unter Xvfb)
        shell: bash
        continue-on-error: true
        run: |
          export QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software LUMEN_PLAYER_SNAPSHOT="/tmp/player.png@1.0" LUMEN_MPV_LOG=v
          xvfb-run -a -s "-screen 0 1600x900x24" lumen "av://lavfi:testsrc2=size=1280x720:rate=24" > /tmp/player.log 2>&1 &
          for i in $(seq 1 40); do [ -s /tmp/player.png ] && break; sleep 1; done
          pkill -x lumen || true
          grep -iE "vo/|vo:|gpu|opengl|egl|x11|error|fail|Playing|AO:|VO:" /tmp/player.log | head -60
          # Ohne GPU lehnt mpv den Software-Renderer ab ("Suspected software renderer") – dann sagt dieser Schritt nichts aus
          if [ -s /tmp/player.png ]; then echo "::notice::Player-Fenster rendert unter Xvfb (${{ matrix.name }})"; else echo "Player-Fenster: kein Bild ohne GPU (${{ matrix.name }})"; fi

      - uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.name }}-${{ matrix.arch }}
          path: |
            build/Lumen-*.deb
            build/Lumen-*.rpm
          if-no-files-found: error
